<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Push to Talk</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: black;
    }

    h1 {
      margin-bottom: 20px;
      color: #004868;
    }

    #icon {
      width: 400px;
      height: 400px;
      margin-bottom: 20px;
    }

    #ptt {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 4px solid #333;
      background-color: #004868;
      color: white;
      font-size: 20px;
      font-weight: bold;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    #ptt.recording {
      background-color: red;
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(255,0,0,0.6);
    }

    #status {
      margin-top: 20px;
      font-size: 18px;
      color: red;
      font-weight: bold;
      visibility: hidden;
    }
  </style>
</head>
<body>
  <h1>Push to Talk</h1>
  
  <!-- Image at the top -->
  <img id="icon" src="resources/eCub_Core_Dark.png" alt="eCub Icon">

  <!-- Push-to-talk button -->
  <div id="ptt">Hold to Talk</div>
  <div id="status">● Recording</div>

  <script src="config.js"></script>
  <script>
    let ws = new WebSocket(window.APP_CONFIG.WS_URL);
    let mediaRecorder;
    const button = document.getElementById("ptt");
    const status = document.getElementById("status");
    let startTime, timerInterval;

    ws.onopen = () => console.log("Connected to server");
    ws.onerror = err => console.error("WebSocket error:", err);
    ws.onclose = () => console.log("WebSocket closed");

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      status.textContent = `● Recording (${elapsed}s)`;
    }

    async function startRecording() {
      if (mediaRecorder && mediaRecorder.state === "recording") return;

      if (ws.readyState === WebSocket.OPEN) ws.send("__NEW_RECORDING__");

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        alert("Microphone access denied!");
        return;
      }

      mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
      mediaRecorder.ondataavailable = e => {
        if (ws.readyState === WebSocket.OPEN) ws.send(e.data);
      };
      mediaRecorder.start(100);

      button.classList.add("recording");
      status.style.visibility = "visible";
      startTime = Date.now();
      timerInterval = setInterval(updateTimer, 1000);
    }

    function stopRecording() {
      if (!mediaRecorder || mediaRecorder.state !== "recording") return;

      setTimeout(() => {
        mediaRecorder.stop();
        if(ws.readyState === WebSocket.OPEN) ws.send("__STOP_RECORDING__");
        button.classList.remove("recording");
        status.style.visibility = "hidden";
        clearInterval(timerInterval);
        console.log("Recording stopped");
      }, 400); // small delay to capture last audio chunk
    }

    // Desktop events
    button.onmousedown = startRecording;
    button.onmouseup = stopRecording;

    // Mobile touch events
    button.ontouchstart = e => { e.preventDefault(); startRecording(); };
    button.ontouchend = e => { e.preventDefault(); stopRecording(); };

    // Global fallback if finger leaves button
    window.onmouseup = stopRecording;
    window.ontouchend = stopRecording;
  </script>
</body>
</html>
